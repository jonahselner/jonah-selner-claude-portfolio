<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonah's AI Portfolio</title>
<meta name="description" content="AI agents, apps and Claude skills Jonah Selner built while running Boost, a patient engagement company for medical practices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23fe7362'/%3E%3Cstop offset='.57' stop-color='%23fe55b0'/%3E%3Cstop offset='1' stop-color='%239e52da'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23231f20'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='900' font-size='15' fill='url(%23g)' text-anchor='middle'%3EJS%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#231f20;--card:#2b2627;--card-2:#332d2e;
  --fg:#ffffff;--fg-muted:#cbd5e1;--fg-subtle:#94a3b8;
  --line:rgba(226,232,240,.12);--line-strong:rgba(226,232,240,.24);
  --coral:#fe7362;--pink:#fe55b0;--purple:#9e52da;
  --grad:linear-gradient(90deg,#fe7362 0%,#fe55b0 57%,#9e52da 100%);
  --display:"Anton",Impact,sans-serif;
  --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--fg-muted);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(158,82,218,.22),transparent 60%),
    radial-gradient(700px 420px at -10% 30%,rgba(254,115,98,.10),transparent 60%),
    repeating-radial-gradient(circle at 78% 8%,rgba(255,255,255,.03) 0 1px,transparent 1px 34px),
    var(--ink)}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.grad{white-space:nowrap;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
svg{display:block}

/* Nav */
.nav{position:sticky;top:0;z-index:10;background:rgba(35,31,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.mark{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:#fff;text-decoration:none;text-transform:uppercase}
.links{display:flex;gap:22px}
.links a{color:var(--fg-muted);text-decoration:none}
.links a:hover{color:#fff}

/* Hero */
.hero .wrap{padding-top:56px;padding-bottom:40px}
.who{display:flex;align-items:center;gap:14px}
.who img{width:56px;height:56px;border-radius:50%;padding:2px;background:var(--grad)}
.who .mono{color:var(--fg-subtle)}
.who b{display:block;color:#fff;font:700 17px/1.2 var(--sans);text-transform:none;letter-spacing:0;margin-bottom:3px}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;color:#fff;font-size:clamp(40px,6.4vw,76px);line-height:1.02;letter-spacing:.005em;margin:28px 0 28px;max-width:22ch}
.loop{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:999px;color:#fff;background:rgba(255,255,255,.03)}
.pill svg{width:16px;height:16px;color:var(--pink)}
.loop .arr{color:var(--fg-subtle)}
.sub{margin:18px 0 0;max-width:60ch;font-size:17px;line-height:1.5;color:var(--fg-muted)}

/* Sections */
section{padding:28px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;border-top:1px solid var(--line);padding-top:22px}
.sh h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:#fff;font-size:32px;letter-spacing:.01em;margin:0}
.sh .mono{color:var(--fg-subtle)}

/* Case cards */
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.case{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:80px;position:relative;overflow:hidden}
.case::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line-strong);color:#fff}
.ic svg{width:22px;height:22px}
.top h3{color:#fff;font:700 20px/1.2 var(--sans);margin:0 0 3px}
.top .mono{color:var(--fg-subtle);font-size:11px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:var(--grad);color:#fff;text-decoration:none;font:500 14px/1 var(--sans);white-space:nowrap;box-shadow:0 8px 22px -10px rgba(254,85,176,.7)}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:14px;height:14px}

.ba{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ba .b{font-family:var(--display);font-size:44px;line-height:1;color:var(--fg-subtle);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:rgba(254,115,98,.75)}
.ba .to{color:var(--fg-subtle);padding-bottom:14px}
.ba .to svg{width:26px;height:26px}
.ba .a{font-family:var(--display);font-size:68px;line-height:1.08;padding-bottom:2px}
.ba .lbl{flex-basis:100%;color:var(--fg-subtle);font-size:11px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.step .h{display:flex;align-items:center;gap:7px;color:var(--fg-subtle);font-size:10.5px;margin-bottom:8px}
.step .h svg{width:15px;height:15px;color:var(--pink)}
.step p{margin:0;color:#fff;font:500 15px/1.3 var(--sans)}

.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.hu{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:14px;font-weight:500}
.hu svg{width:16px;height:16px;color:var(--coral)}
.proof{color:var(--fg-subtle);font-size:11px}
.more{margin-left:auto;display:flex;gap:14px}
.more a{display:inline-flex;align-items:center;gap:4px;color:var(--fg-muted);text-decoration:none;font-size:11px}
.more a:hover{color:#fff}
.more svg{width:12px;height:12px}

/* Rows */
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;transition:border-color .15s,background .15s}
.row:hover{border-color:var(--line-strong);background:rgba(255,255,255,.05)}
.row .ic{width:36px;height:36px;border-radius:10px}
.row .ic svg{width:17px;height:17px}
.row b{display:block;color:#fff;font:600 15px/1.25 var(--sans)}
.row span{display:block;color:var(--fg-subtle);font-size:13px;line-height:1.35}
.row .go{width:16px;height:16px;color:var(--pink)}

footer{padding:28px 0 40px;color:var(--fg-subtle)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}

@media (max-width:920px){.cases,.rows{grid-template-columns:1fr}}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero .wrap{padding-top:36px;padding-bottom:24px}
  .links{gap:14px}
  .case{padding:18px}
  .top{grid-template-columns:auto minmax(0,1fr)}
  .top .btn{grid-column:1/-1;justify-content:center}
  .steps{grid-template-columns:1fr}
  .step{display:flex;align-items:center;gap:12px}
  .step .h{margin:0;min-width:96px}
  .ba .a{font-size:56px}.ba .b{font-size:36px}
  .more{margin-left:0}
}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="mark" href="#top">Jonah Selner</a>
  <div class="links mono"><a href="#case-studies">Case studies</a><a href="#more">More</a></div>
</div></nav>

<header class="hero" id="top"><div class="wrap">
  <div class="who">
    <img src="jonah.jpg" alt="Jonah Selner" width="56" height="56">
    <div class="mono"><b>Jonah Selner</b>Co-founder, Boost · patient engagement</div>
  </div>
  <h1>I take work apart and rebuild it <span class="grad">with AI</span>.</h1>
  <div class="loop mono" id="loop"></div>
  <p class="sub">Agents, apps and Claude skills from running Boost, a patient engagement company for medical practices.</p>
</div></header>

<main id="main"></main>

<footer><div class="wrap mono"><span>© Jonah Selner</span><span>Audit → Optimize → Automate</span></div></footer>

<script src="projects.js"></script>
<script>
(function(){
  var I = {
    audit:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    optimize:'<path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 18h4"/><path d="M12 18h8"/><circle cx="10" cy="18" r="2"/><path d="M4 12h2"/><path d="M10 12h10"/><circle cx="8" cy="12" r="2"/>',
    automate:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    human:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    arrowR:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
    ext:'<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
    timer:'<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>',
    phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    split:'<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/>',
    star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
    mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    spark:'<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2Z"/>'
  };
  function svg(k,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[k]||I.spark)+'</svg>';}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function ext(u){return /^https?:/.test(u);}
  function a(l,cls,inner){return '<a class="'+cls+'" href="'+esc(l.url)+'"'+(ext(l.url)?' target="_blank" rel="noopener"':'')+'>'+inner+'</a>';}
  function primary(p){var l=p.links||[];return l.filter(function(x){return x.primary;})[0]||l[0];}

  var items = (window.PORTFOLIO||[]).slice();
  var STEPS=[["audit","Audit"],["optimize","Optimize"],["automate","Automate"]];

  document.getElementById("loop").innerHTML = STEPS.map(function(s){return '<span class="pill">'+svg(s[0])+s[1]+'</span>';}).join('<span class="arr">'+svg("arrowR").replace('<svg','<svg width="18" height="18"')+'</span>');

  function card(p){
    var pr=primary(p), others=(p.links||[]).filter(function(l){return l!==pr;}).slice(0,2);
    return '<article class="case" id="'+esc(p.id)+'">'+
      '<div class="top"><div class="ic">'+svg(p.icon)+'</div>'+
        '<div><h3>'+esc(p.name)+'</h3><div class="mono">'+esc(p.subtitle||"")+'</div></div>'+
        (pr?a(pr,'btn',esc(pr.label)+svg("ext")):'')+'</div>'+
      '<div class="ba"><span class="b">'+esc(p.before)+'</span><span class="to">'+svg("arrowR")+'</span><span class="a grad">'+esc(p.after)+'</span><span class="lbl mono">'+esc(p.baLabel)+'</span></div>'+
      '<div class="steps">'+STEPS.map(function(s){return '<div class="step"><div class="h mono">'+svg(s[0])+s[1]+'</div><p>'+esc(p[s[0]])+'</p></div>';}).join("")+'</div>'+
      '<div class="foot">'+(p.human?'<span class="hu">'+svg("human")+esc(p.human)+'</span>':'')+(p.proof?'<span class="proof mono">'+esc(p.proof)+'</span>':'')+
        (others.length?'<span class="more mono">'+others.map(function(l){return a(l,'',esc(l.label)+svg("ext"));}).join("")+'</span>':'')+'</div>'+
    '</article>';
  }
  function row(p){
    var pr=primary(p); if(!pr) return '';
    return a(pr,'row','<div class="ic">'+svg(p.icon)+'</div><div><b>'+esc(p.name)+'</b><span>'+esc(p.subtitle||"")+'</span></div>'+svg("ext","go"));
  }
  var feat=items.filter(function(p){return p.featured;}).sort(function(x,y){return x.featured-y.featured;});
  var rest=items.filter(function(p){return !p.featured;});
  document.getElementById("main").innerHTML =
    '<section id="case-studies"><div class="wrap"><div class="sh"><h2>Case studies</h2><span class="mono">'+feat.length+' builds</span></div><div class="cases">'+feat.map(card).join("")+'</div></div></section>'+
    (rest.length?'<section id="more"><div class="wrap"><div class="sh"><h2>More builds</h2><span class="mono">'+rest.length+' apps + skills</span></div><div class="rows">'+rest.map(row).join("")+'</div></div></section>':'');
})();
</script>
</body>
</html>
