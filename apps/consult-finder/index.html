<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consult Finder</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='14' cy='14' r='9' fill='none' stroke='%231a73e8' stroke-width='4'/><path d='M21 21l7 7' stroke='%231a73e8' stroke-width='4' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #ffffff; --text: #202124; --muted: #5f6368; --line: #dfe1e5; --shadow: rgba(32,33,36,.28);
    --accent: #1a73e8; --card: #ffffff;
    --book: #137333; --book-bg: #e6f4ea;
    --mo: #1a73e8; --mo-bg: #e8f0fe;
    --advise: #5f6368; --advise-bg: #f1f3f4;
    --ask: #b06000; --ask-bg: #fef7e0;
    --danger: #c5221f; --danger-bg: #fce8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --line: #5f6368; --shadow: rgba(0,0,0,.6);
      --accent: #8ab4f8; --card: #292a2d;
      --book: #81c995; --book-bg: #1e3a2a;
      --mo: #8ab4f8; --mo-bg: #1f2f4a;
      --advise: #bdc1c6; --advise-bg: #303134;
      --ask: #fdd663; --ask-bg: #3d3420;
      --danger: #f28b82; --danger-bg: #4a2422;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
  main { max-width: 584px; margin: 0 auto; padding: 0 16px; min-height: 100vh;
    display: flex; flex-direction: column; }
  .top { padding-top: 22vh; transition: padding-top .2s ease; }
  body.has-result .top { padding-top: 8vh; }
  h1 { text-align: center; font-weight: 400; font-size: 44px; letter-spacing: -1px; margin: 0 0 26px; }
  h1 span { color: var(--accent); }
  .search { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 24px; background: var(--card); }
  .search:hover, .search:focus-within { box-shadow: 0 1px 6px var(--shadow); border-color: transparent; }
  .search svg { flex: none; color: var(--muted); }
  input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 17px; font-family: inherit; height: 100%; }
  input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  #clear { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer;
    padding: 0 4px; display: none; line-height: 1; }
  body.has-text #clear { display: block; }
  .hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 18px; }
  body.has-result .hint { display: none; }

  .result { margin-top: 24px; border-radius: 16px; padding: 22px 24px; display: none; }
  body.has-result .result { display: block; }
  .label { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .title { font-size: 28px; line-height: 1.2; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--card); }
  .why { margin-top: 12px; font-size: 16px; color: var(--muted); }
  .note { margin-top: 12px; font-size: 16px; font-weight: 700; color: var(--ask); }
  .also { margin-top: 8px; font-size: 15px; color: var(--muted); }

  .k-book { background: var(--book-bg); } .k-book .label, .k-book .chip { color: var(--book); }
  .k-mo { background: var(--mo-bg); } .k-mo .label, .k-mo .chip { color: var(--mo); }
  .k-advise { background: var(--advise-bg); } .k-advise .label { color: var(--advise); }
  .k-ask { background: var(--ask-bg); } .k-ask .label { color: var(--ask); }
  .k-urgent, .k-911 { background: var(--danger-bg); } .k-urgent .label, .k-911 .label, .k-urgent .title, .k-911 .title { color: var(--danger); }
  .opts { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .opts button { flex: 1; min-width: 120px; font: inherit; font-size: 17px; font-weight: 700; padding: 12px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .opts button:hover, .opts button:focus-visible { border-color: var(--ask); outline: none; }
  .opts small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  footer { margin-top: auto; padding: 24px 0; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Consult<span>Finder</span></h1>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" autofocus
        placeholder="What is the caller asking about?" aria-label="What is the caller asking about?">
      <button id="clear" type="button" aria-label="Clear">×</button>
    </label>
    <div class="hint">Type a few words, like “lip filler” or “sun spots”.</div>
  </div>
  <section id="out" class="result" aria-live="polite"></section>
  <footer>Runs on this screen only. Nothing is saved or sent.</footer>
</main>
<script src="engine.js"></script>
<script>
  const q = document.getElementById("q"), out = document.getElementById("out"), clear = document.getElementById("clear");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function card(r) {
    if (r.kind === "book") {
      return `<div class="label">Book consult</div>
        <div class="title">${esc(r.name)}</div>
        <div class="row"><span class="chip">${r.fee === "Free" ? "Free consult" : esc(r.fee) + " fee"}</span></div>
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
        <div class="why">${esc(r.why)}</div>
        ${r.also ? `<div class="also">Also note for provider: ${esc(r.also)}</div>` : ""}`;
    }
    if (r.kind === "mo") return `<div class="label">No consult needed</div>
        <div class="title">Transfer to MO</div><div class="row"><span class="chip">${esc(r.service)}</span></div>`;
    if (r.kind === "advise") return `<div class="label">Do not book</div>
        <div class="title">${esc(r.title)}</div><div class="why">${esc(r.why)}</div>`;
    if (r.kind === "urgent" || r.kind === "911") return `<div class="label">Urgent</div>
        <div class="title">${esc(r.title)}</div><div class="why">${esc(r.why)}</div>`;
    if (r.kind === "ask") return `<div class="label">Ask the caller</div>
        <div class="title">${esc(r.ask)}</div>
        <div class="opts">${r.options.map((o, i) =>
          `<button type="button" data-i="${i}">${esc(o.label)}<small>${esc(o.res.short)} · ${o.res.fee === "Free" ? "Free" : esc(o.res.fee)}</small></button>`).join("")}</div>`;
    return "";
  }

  let current = null;
  function show(r) {
    current = r;
    document.body.classList.toggle("has-result", !!r);
    if (!r) { out.innerHTML = ""; out.className = "result"; return; }
    out.className = "result k-" + r.kind;
    out.innerHTML = card(r);
  }

  let timer;
  function run() { show(window.ConsultEngine.route(q.value)); }
  q.addEventListener("input", () => {
    document.body.classList.toggle("has-text", q.value.length > 0);
    clearTimeout(timer); timer = setTimeout(run, 180);
  });
  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { clearTimeout(timer); run(); }
    if (e.key === "Escape") reset();
  });
  out.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (b && current && current.kind === "ask") show(current.options[+b.dataset.i].res);
  });
  function reset() { q.value = ""; document.body.classList.remove("has-text"); show(null); q.focus(); }
  clear.addEventListener("click", reset);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  });
</script>
</body>
</html>
